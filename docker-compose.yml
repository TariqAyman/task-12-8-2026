services:
    app:
        build:
            context: .
            target: runtime
        image: moneyflex-api
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:8000'
        environment:
            APP_ENV: ${APP_ENV:-production}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_KEY: ${APP_KEY:-}
            APP_URL: ${APP_URL:-http://localhost:8000}
            L5_SWAGGER_CONST_HOST: ${APP_URL:-http://localhost:8000}/api
            L5_SWAGGER_GENERATE_ALWAYS: 'false'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-moneyflex}
            DB_USERNAME: ${DB_USERNAME:-moneyflex}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            CACHE_STORE: redis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
            SANCTUM_TOKEN_EXPIRATION: ${SANCTUM_TOKEN_EXPIRATION:-60}
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - moneyflex

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-moneyflex}
            MYSQL_USER: ${DB_USERNAME:-moneyflex}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_ALLOW_EMPTY_PASSWORD: 0
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-root}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - moneyflex

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - moneyflex

networks:
    moneyflex:
        driver: bridge

volumes:
    mysql-data:
    redis-data:
